name: Build .NET SDK with Container

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '.NET VMR branch name'
        required: true
        type: string
        default: main
      architecture:
        description: 'Architecture to build for'
        required: true
        type: choice
        options:
          - arm64
          - ppc64le
          - riscv64
          - s390x
      buildId:
        description: 'Official Build Id (officialBuildId in the release.json of the VMR release, e.g. 20261029.8)'
        required: false
        type: string
        default: ''
      extra-args:
        description: 'Extra arguments to pass to the build script'
        required: false
        type: string
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest

    steps:

    - name: Summarize inputs
      id: params
      run: |
        # Artifact names cannot contain '/', e.g. for release/10.0.1xx.
        echo "artifact-ref=$(echo '${{ inputs.branch }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
        cat >> "$GITHUB_STEP_SUMMARY" <<EOF
        | Branch | Architecture | Build Id | Extra args |
        |---|---|---|---|
        | \`${{ inputs.branch }}\` | \`${{ inputs.architecture }}\` | \`${{ inputs.buildId }}\` | \`${{ inputs.extra-args }}\` |
        EOF

    - name: Clean up hosted runner
      # Removes unused preinstalled toolchains because otherwise we could run out of disk space.
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h /

    - name: Clone repository
      run: |
        git clone --depth 1 -b ${{ inputs.branch }} https://github.com/dotnet/dotnet

    - name: Build
      run: |
        docker run --platform linux/amd64 --rm -v${{ github.workspace }}/dotnet:/dotnet -w /dotnet -e ROOTFS_DIR=/crossrootfs/${{ inputs.architecture }} \
          mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-${{ inputs.architecture }} \
          sh -c '
            ./prep-source-build.sh &&
            ./build.sh --clean-while-building -sb --os linux --arch ${{ inputs.architecture }} ${{ inputs.buildId && format('--official-build-id {0}', inputs.buildId) || '' }} ${{ inputs.extra-args }}
          '

    - name: List assets directory
      if: always()
      run: |
        df -h /
        find "${{ github.workspace }}/dotnet/artifacts/assets" || true

    - name: Upload build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ steps.params.outputs.artifact-ref }}-linux-${{ inputs.architecture }}
        path: ${{ github.workspace }}/dotnet/artifacts/log/
        if-no-files-found: ignore

    - name: Upload .NET
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-sdk-${{ steps.params.outputs.artifact-ref }}-linux-${{ inputs.architecture }}-artifacts
        path: |
          ${{ github.workspace }}/dotnet/artifacts/assets/Release/Sdk/*/dotnet-sdk-*
          ${{ github.workspace }}/dotnet/artifacts/assets/Release/Private.SourceBuilt.Artifacts.*.tar.gz
          ${{ github.workspace }}/dotnet/artifacts/packages/Release/Shipping/runtime/Microsoft.NETCore.App.Crossgen2.linux-${{ inputs.architecture }}.*.nupkg
